1. whether independent ChemicalState copies used for full/half branches are actually independent;
2. whether the first kinetics call applies native preconditioning and whether full vs half branches receive equivalent startup treatment;
3. whether restoring only ChemicalState after a rejected successful trial is equivalent to retrying with a newly constructed solver;
4. whether a failed/exceptional solve can leave solver-side history that requires reconstruction;
5. which reaction-progress/mineral-amount quantities are safely accessible for Richardson control and their units;
6. exact result success/iteration evidence available for logging.

Do not modify scientific parameters. Do not run a large development case when a minimal chemical system answers the question. Report the exact claim, probe, observed result, and confidence. If sandbox restrictions prevent a required probe, report that explicitly rather than guessing.
"""
