# Jayasekara et al. (2020), Table 4, fixed-temperature kinetic parameters.
# Paper: CO2-brine-caprock interaction: Reactivity experiments on mudstone
# caprock of South-west Hub geo-sequestration project.
#
# The experiment/model temperature is fixed at 40 degC. Table 4 reports k40
# directly, so each acid-term A below is the reported k40 value and E is set
# to 0 J/mol. This is an implementation encoding, not a scientific assertion
# that Ea = 0: it makes the Kinec evaluator return exactly
#     k40 * a_H+^n * (1 - Omega)
# at 40 degC, matching the paper's Eq. (3), while avoiding re-derivation from
# k25/Ea where the published table contains values that do not all reproduce
# the tabulated k40 exactly.
#
# sigma = 1 gives the paper affinity factor (1 - Q/K) = (1 - Omega).
# Mineral keys use this repository's local thermodynamic-database names.
# Chlorite -> Clinochlore-14A; K-feldspar -> K-Feldspar;
# Montmorillonite -> Montmor-Ca.

Quartz:
  family: standard
  omega: Quartz
  sigma: 1.0
  terms:
    acid: {A: 5.45e-14, E: 0.0, n: 0.0}

Illite:
  family: standard
  omega: Illite
  sigma: 1.0
  terms:
    acid: {A: 9.68e-13, E: 0.0, n: 0.1}

