# Synthetic software-test fixture only.
#
# Values are deliberately minimal and are not a physical experiment, benchmark,
# validation case, or source for scientific interpretation.
case:
  name: synthetic_software_only_kinec

paths:
  output_dir: outputs/synthetic_software_only_kinec

database:
  source: local
  path: data/thermo/Kinec_v3_4.dat

activity_models:
  aqueous: phreeqc

physical:
  temperature_c: 25.0
  pressure_bar: 1.0

brine:
  aqueous_elements: [H, O, C, Ca]
  species_amounts:
    H2O: {value: 1.0, unit: kg}

co2:
  mode: disabled

redox:
  enabled: false

kinetics:
  enabled: true
  model: kinec
  path: data/kinetics/kinec_rates_minimal.yaml

minerals:
  - name: Calcite
    role: kinetic
    initial_amount: {value: 1.0, unit: mol}
    surface_area: {value: 1.0, unit: m2/g}
    surface_area_basis: "Synthetic unit surface area for software tests only"
    surface_area_provenance: "tests/fixtures/cases/synthetic_kinec_case.yaml"
    selection_reason: "Minimal mapped mineral used only to exercise software paths"

solver:
  workflow:
    mode: closed_kinetics
  timestep:
    mode: fixed
    time:
      duration_value: 2.0
      duration_unit: seconds
    step_size:
      dt: {value: 1.0, unit: seconds}
    output_schedule:
      mode: every_internal_step
      include_initial: true
      include_final: true
      explicit_times: []
    checkpoint_schedule:
      enabled: false
      times: []

postprocessing:
  requested_species: [H+, HCO3-, CO3-2]
  requested_elements: []
  requested_minerals: [Calcite]
  aqueous_molalities: true
  saturation_indices: true
  reaction_rates: false
  element_budget: {enabled: false, elements: [], species: {}, minerals: {}, gas_species: {}}
  carbon_inventory: {enabled: false, carbon_species: {}, carbon_minerals: {}, carbon_gas_species: {}}
  mineral_volume_change: {enabled: false, molar_volumes_cm3_per_mol: {}, sources: {}}
  regime_classification: {enabled: false}
  surface_area_audit: {enabled: false}
  workflow_comparison: {enabled: false}
  secondary_mineral_assemblage: {enabled: false}
  surrogate_dataset: {enabled: false}
  porosity_permeability: {enabled: false}

validation:
  enabled: false

outputs:
  monitor:
    enabled: true
    refresh_interval_s: 0.5
    scalars: [pH]
    species: []
    minerals: []
    result_times: []
  manifest: {enabled: true, include_input_snapshot: true}
  diagnostics: {enabled: true}
  timeseries: {enabled: true, include_species_amounts: true, include_species_molalities: true, include_mineral_amounts: true, include_mineral_deltas: true, include_saturation_indices: true, include_solver_columns: true}
  summaries: {mineral_summary: true, aqueous_summary: true, reaction_rates: false, reaction_rate_validation: false, carbon_inventory: false, element_budget: false, mineral_volume_change: false, regime_classification: false, surface_area_audit: false, workflow_comparison: false, secondary_mineral_assemblage: false, surrogate_dataset: false, porosity_permeability: false}
  solver_history: {enabled: true}
  plots: {enabled: false, pH: false, mineral_change: false, saturation_index: false, solver_dt: false, solver_iterations: false}
  debug: {enabled: true, mineral_connection: true, resolved_config: true, final_state: true}
