# Schema template only. Replace placeholders with source-supported values.
case:
  name: REQUIRED

paths:
  output_dir: REQUIRED

database:
  source: REQUIRED  # embedded | local
  name: REQUIRED_IF_EMBEDDED
  path: REQUIRED_IF_LOCAL_DATABASE

activity_models:
  aqueous: REQUIRED  # phreeqc
  gas: OPTIONAL  # peng_robinson_phreeqc

physical:
  temperature_c: TBD_SOURCE_REQUIRED
  pressure_bar: TBD_SOURCE_REQUIRED

brine:
  aqueous_elements: [REQUIRED]
  # Choose exactly one initialization mapping. species_amounts is the
  # backward-compatible explicit-species form.
  species_amounts:
    REQUIRED_SPECIES_NAME: {value: TBD_SOURCE_REQUIRED, unit: REQUIRED}
  # Alternative: remove species_amounts and use conserved aqueous totals.
  # element_amounts:
  #   REQUIRED_ELEMENT_SYMBOL: {value: TBD_SOURCE_REQUIRED, unit: REQUIRED}

co2:
  mode: REQUIRED  # disabled | finite | fixed_fugacity
  gas_species: REQUIRED_IF_ENABLED
  initial_amount: {value: REQUIRED_IF_FINITE, unit: REQUIRED_IF_FINITE}
  fugacity_bar: REQUIRED_IF_FIXED_FUGACITY

redox:
  enabled: REQUIRED
  pe: REQUIRED_IF_ENABLED
  apply_during: REQUIRED_IF_ENABLED  # initial_equilibrium_only | kinetic_steps

kinetics:
  enabled: REQUIRED
  model: OPTIONAL  # palandri_kharaka (default) | kinec
  path: OPTIONAL  # defaults to the selected model's project parameter file

minerals:
  - name: REQUIRED
    role: REQUIRED  # equilibrium | kinetic
    initial_amount: {value: REQUIRED_IF_CONFIGURED, unit: REQUIRED_IF_CONFIGURED}
    surface_area: {value: REQUIRED_IF_KINETIC, unit: REQUIRED_IF_KINETIC}

solver:
  workflow:
    mode: REQUIRED
  timestep:
    mode: fixed
    max_internal_steps: OPTIONAL
    time:
      duration_value: REQUIRED
      duration_unit: REQUIRED
      year_definition_days: REQUIRED_IF_ANY_TIME_USES_YEARS
    step_size:
      dt: REQUIRED
    output_schedule:
      mode: OPTIONAL  # every_internal_step | explicit | logarithmic | hybrid
      include_initial: OPTIONAL
      include_final: OPTIONAL
      explicit_times: []
      logarithmic: OPTIONAL  # {start: {value, unit}, end: {value, unit}, points_per_decade: int}
    checkpoint_schedule:
      enabled: OPTIONAL
      times: []

# For mode: adaptive, replace step_size.dt with dt_initial/dt_min/dt_max,
# growth_factor, shrink_factor, and max_retries_per_step.
#
# For mode: adaptive_error_controlled, use the same explicit time/schedule
# blocks plus:
# step_size:
#   dt_initial: {value: REQUIRED, unit: REQUIRED}
#   dt_min: {value: REQUIRED, unit: REQUIRED}
#   dt_max: {value: REQUIRED, unit: REQUIRED}
#   safety_factor: REQUIRED
#   growth_factor: REQUIRED
#   shrink_factor: REQUIRED
#   solver_failure_shrink_factor: REQUIRED
#   max_retries_per_step: REQUIRED
# error_control:
#   temporal_order: REQUIRED_NO_DEFAULT
#   relative_tolerance: REQUIRED_DIMENSIONLESS
#   negative_amount_tolerance: {value: REQUIRED, unit: mol}
#   controlled_minerals:
#     - name: EVERY_KINETIC_MINERAL_EXACTLY_ONCE
#       absolute_tolerance: {value: REQUIRED, unit: mol}
#       reference_floor: {value: REQUIRED, unit: mol}
# events:
#   hard_mineral_exhaustion: null  # or explicit positive-mol/time/restart/localisation controls
#   soft: null  # or explicit SI/pH/secondary-mineral/reaction-rate cap controls

postprocessing:
  # Requested lists automatically produce their standard timeseries columns
  # and aqueous/mineral summary tables.
  requested_species: []
  requested_elements: []
  requested_minerals: []
  reaction_rates: REQUIRED
  reaction_rate_validation: REQUIRED
  element_budget:
    enabled: REQUIRED
    elements: []
    species: {}
    minerals: {}
    gas_species: {}
  carbon_inventory:
    enabled: REQUIRED
    carbon_species: {}
    carbon_minerals: {}
    carbon_gas_species: {}
  mineral_volume_change:
    enabled: REQUIRED
    molar_volumes_cm3_per_mol: {}
    sources: {}
  regime_classification:
    enabled: REQUIRED
  surface_area_audit:
    enabled: REQUIRED
  workflow_comparison:
    enabled: REQUIRED
  secondary_mineral_assemblage:
    enabled: REQUIRED
  surrogate_dataset:
    enabled: REQUIRED
    validity_domain: REQUIRED_IF_ENABLED
  porosity_permeability:
    enabled: REQUIRED
    bulk_volume_cm3: REQUIRED_IF_ENABLED
    permeability_update_law: REQUIRED_IF_ENABLED
    capillary_entry_pressure_law: REQUIRED_IF_ENABLED

validation:
  enabled: REQUIRED
  script: REQUIRED_IF_ENABLED

# Manifest, diagnostics, timeseries, solver history, and enabled scientific
# postprocessing tables are standard outputs and need no separate switches.
plots:
  enabled: REQUIRED
  pH: REQUIRED
  mineral_change: REQUIRED
  saturation_index: REQUIRED
  solver_dt: REQUIRED
  solver_iterations: REQUIRED

monitor:
  enabled: true
  refresh_interval_s: 0.5
  scalars: [pH]
  species: []
  minerals: []
  result_times: []

debug:
  enabled: REQUIRED
  mineral_connection: REQUIRED
  resolved_config: REQUIRED
  final_state: REQUIRED
