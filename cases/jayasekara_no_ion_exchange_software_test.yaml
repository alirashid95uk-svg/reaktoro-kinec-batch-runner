# Source values: legacy_sources/FYPR Preliminary Results Code.zip
# Entry: FYPR Preliminary Results Code/configs/cases/BaseCase_Redx_IonEx.yaml
#
# Purpose: an expected-failure mineral-mapping audit derived from the old
# no-ion-exchange config. Its exact embedded-database species names do not all
# have custom Kinec records. It is not a runnable experiment reproduction.
#
# The source cation_exchange block is intentionally excluded. Cation exchange
# is not implemented by this runner and is not silently ignored.
#
# Legacy controls retained as provenance but not selected by this fixed-step
# case: dt_initial_s=1.0, dt_min_s=1.0e-4, growth_factor=1.05,
# max_consecutive_rejected=30, progress_every=250, time_tolerance_s=1.0e-7,
# output weeks=[2, 5, 9, 18, 37], warning codes=[906, 548].
#
# Legacy postprocessing provenance:
# elements=[Ca, Mg, K, Na, Si, Al, Fe]
# saturation-index map:
# Quartz=Quartz; Illite=Illite; Chlorite(14A)=Chlorite; Anorthite=Anorthite;
# Albite=Albite; K-feldspar=K-feldspar; Kaolinite=Kaolinite;
# Goethite=Goethite; Pyrite=Pyrite; Ca-Montmorillonite=Ca-Montmorillonite;
# Gibbsite=Gibbsite; Chalcedony=SiO2(a); Fe(OH)3(a)=Fe(OH)3(a).
case:
  name: jayasekara_no_ion_exchange_software_test

paths:
  output_dir: outputs/jayasekara_no_ion_exchange_software_test

database:
  source: embedded
  name: phreeqc.dat

activity_models:
  aqueous: phreeqc

physical:
  temperature_c: 40.0
  pressure_bar: 100.0

brine:
  aqueous_elements:
    - H
    - O
    - Na
    - Cl
    - Si
    - Al
    - Fe
    - K
    - Ca
    - Mg
    - S
    - C
  species_amounts:
    H2O:
      value: 1.0
      unit: kg
    # Deterministic legacy preprocessing: (45.0 / 58.44277) / 0.955.
    Na+:
      value: 0.8062660077228978
      unit: mol
    Cl-:
      value: 0.8062660077228978
      unit: mol

co2:
  mode: fixed_fugacity
  gas_species: CO2(g)
  fugacity_bar: 57.77

redox:
  enabled: true
  pe: 4.0
  apply_during: kinetic_steps

kinetics:
  enabled: true
  model: kinec

minerals:
  - name: Quartz
    role: kinetic
    initial_amount: {value: 4.26, unit: mol}
    surface_area: {value: 0.036, unit: m2/g}
  - name: Illite
    role: kinetic
    initial_amount: {value: 0.47, unit: mol}
    surface_area: {value: 0.461, unit: m2/g}
  - name: Chlorite(14A)
    role: kinetic
    initial_amount: {value: 0.19, unit: mol}
    surface_area: {value: 1.140, unit: m2/g}
  - name: Anorthite
    role: kinetic
    initial_amount: {value: 0.17, unit: mol}
    surface_area: {value: 0.035, unit: m2/g}
  - name: Albite
    role: kinetic
    initial_amount: {value: 0.18, unit: mol}
    surface_area: {value: 0.036, unit: m2/g}
  - name: K-feldspar
    role: kinetic
    initial_amount: {value: 0.26, unit: mol}
    surface_area: {value: 0.0373, unit: m2/g}
  - name: Kaolinite
    role: kinetic
    initial_amount: {value: 0.19, unit: mol}
    surface_area: {value: 1.160, unit: m2/g}
  - name: Goethite
    role: kinetic
    initial_amount: {value: 0.54, unit: mol}
    surface_area: {value: 0.022, unit: m2/g}
  - name: Pyrite
    role: kinetic
    initial_amount: {value: 0.07, unit: mol}
    surface_area: {value: 0.036, unit: m2/g}
  - name: Ca-Montmorillonite
    role: kinetic
    initial_amount: {value: 0.02, unit: mol}
    surface_area: {value: 0.045, unit: m2/g}
  - name: Gibbsite
    role: equilibrium
    initial_amount: {value: 0.0, unit: mol}
  - name: Chalcedony
    role: equilibrium
    initial_amount: {value: 0.0, unit: mol}
  - name: Fe(OH)3(a)
    role: equilibrium
    initial_amount: {value: 0.0, unit: mol}

solver:
  workflow:
    mode: fixed_fugacity_during_kinetic_steps
    precondition_kinetics: false
  timestep:
    mode: fixed
    time: {duration_value: 22377600.0, duration_unit: seconds}
    step_size:
      dt: {value: 2700.0, unit: seconds}

postprocessing:
  requested_species:
    - H2O
  requested_minerals: [Quartz, Illite, Chlorite(14A), Anorthite, Albite, K-feldspar, Kaolinite, Goethite, Pyrite, Ca-Montmorillonite, Gibbsite, Chalcedony, Fe(OH)3(a)]
  aqueous_molalities: true
  saturation_indices: true
  reaction_rates: false
  element_budget: {enabled: false, elements: [], species: {}, minerals: {}, gas_species: {}}
  carbon_inventory: {enabled: false, carbon_species: {}, carbon_minerals: {}, carbon_gas_species: {}}
  mineral_volume_change: {enabled: false, molar_volumes_cm3_per_mol: {}, sources: {}}
  regime_classification: {enabled: false}
  surface_area_audit: {enabled: false}
  workflow_comparison: {enabled: false}
  secondary_mineral_assemblage: {enabled: false}
  surrogate_dataset: {enabled: false}
  porosity_permeability: {enabled: false}

validation:
  enabled: false
  targets: []

outputs:
  manifest: {enabled: true, include_input_snapshot: true}
  diagnostics: {enabled: true}
  timeseries: {enabled: true, include_species_amounts: true, include_species_molalities: true, include_mineral_amounts: true, include_mineral_deltas: true, include_saturation_indices: true, include_solver_columns: true}
  summaries: {mineral_summary: true, aqueous_summary: true, reaction_rates: false, reaction_rate_validation: false, carbon_inventory: false, element_budget: false, mineral_volume_change: false, regime_classification: false, surface_area_audit: false, workflow_comparison: false, secondary_mineral_assemblage: false, surrogate_dataset: false, validation_ledger: false, porosity_permeability: false}
  solver_history: {enabled: true}
  plots: {enabled: false, pH: false, mineral_change: false, saturation_index: false, solver_dt: false, solver_iterations: false}
  debug: {enabled: true, mineral_connection: true, resolved_config: true, final_state: true}
